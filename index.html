<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrabble Counter</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --surface: #ffffff;
      --ink: #1f2933;
      --line: #e6e1d6;
      --teal: #0f766e;
      --teal-ink: #115e59;
      --pass: #e7e5e4;
      --pass-ink: #44403c;
      --word: #dbeafe;
      --word-ink: #1e40af;
      --challenge: #ffe4e6;
      --challenge-ink: #9f1239;
      --undo: #e7f4f2;
      --total: #f7fbfa;
    }
    * {
      touch-action: manipulation;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
    }
    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      width: 100%;
      margin: auto;
    }
    .player-headers {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      width: 100%;
    }
    .header {
      background: var(--teal);
      color: white;
      padding: 10px;
      cursor: pointer;
    }
    .swap-players {
      background: var(--teal);
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.28);
      border-right: 1px solid rgba(255, 255, 255, 0.28);
      color: white;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      padding: 10px 14px;
    }
    .swap-players:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .columns {
      display: flex;
      flex-direction: row;
      width: 100%;
    }
    .column {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      min-height: 300px;
      cursor: pointer;
    }
    .column:nth-child(even) {
      background: var(--total);
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    .buttons button, .undo-button {
      flex: 1;
      padding: 10px;
      border: none;
      cursor: pointer;
    }
    .undo-button:first-child {
      border-right: 1px solid #cfe8e4;
    }
    .undo-button:last-child {
      border-left: 1px solid #cfe8e4;
    }
    .reset-button {
      width: 100%;
      padding: 15px;
      background: var(--teal);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 18px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 41, 51, 0.46);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(31, 41, 51, 0.18);
      width: 100%;
      max-width: 300px;
    }
    .modal-content .input-display {
      font-size: 24px;
      padding: 10px;
      margin: 10px;
      text-align: center;
      background: var(--bg);
      color: var(--ink);
    }
    .keyboard button {
      width: 30%;
      border: none;
      padding: 20px;
      margin-top: 4px;
      font-size: 22px;
      background: #f8fafc;
      color: var(--ink);
    }
    .keyboard .special {
      background-color: var(--pass);
      color: var(--pass-ink);
    }
    .modal-controls button {
      border: none;
      padding: 20px;
      margin-top: 16px;
      margin-bottom: 16px;
      font-size: 22px;
      width: 46%;
    }
    .modal-controls .confirm {
      background: var(--teal);
      color: white;
    }
    .modal-controls .cancel {
      background: var(--challenge);
      color: var(--challenge-ink);
    }
    .green {
      background-color: var(--teal);
      color: white;
    }
    .lightgreen {
      background-color: var(--undo);
      color: var(--teal-ink);
    }
    .blue {
      background-color: var(--word);
      color: var(--word-ink);
    }
    .red {
      background-color: var(--challenge);
      color: var(--challenge-ink);
    }
    .gray {
      background-color: var(--pass);
      color: var(--pass-ink);
    }
  </style>
</head>
<body>
  <div class="player-headers">
    <div class="header" id="player1-name" onclick="setPlayerName(1)">Gracz 1</div>
    <button type="button" id="swap-players" class="swap-players" onclick="swapPlayers()" aria-label="Zamień graczy miejscami" title="Zamień graczy miejscami">⇄</button>
    <div class="header" id="player2-name" onclick="setPlayerName(2)">Gracz 2</div>
  </div>
  <div class="container">
    <div class="buttons">
      <button class="gray" onclick="addSpecialMove(1, 'P')">P</button>
      <button class="blue" onclick="addSpecialMove(1, 'W')">W</button>
      <button class="red" onclick="addSpecialMove(1, 'X')">X</button>
    </div>
    <div class="buttons">
      <button class="gray" onclick="addSpecialMove(2, 'P')">P</button>
      <button class="blue" onclick="addSpecialMove(2, 'W')">W</button>
      <button class="red" onclick="addSpecialMove(2, 'X')">X</button>
    </div>
  </div>
  <div class="columns">
    <div class="column" id="player1-scores" onclick="showModal(1)"></div>
    <div class="column" id="player1-total"></div>
    <div class="column" id="player2-scores" onclick="showModal(2)"></div>
    <div class="column" id="player2-total"></div>
  </div>
  <div class="container">
    <button class="undo-button lightgreen" onclick="undoMove(1)">Cofnij</button>
    <button class="undo-button lightgreen" onclick="undoMove(2)">Cofnij</button>
  </div>
  <button class="reset-button" onclick="resetGame()">Reset</button>
  
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="input-display" id="modal-display">0</div>
      <div class="keyboard">
        <button onclick="updateInput(1)">1</button>
        <button onclick="updateInput(2)">2</button>
        <button onclick="updateInput(3)">3</button>
        <button onclick="updateInput(4)">4</button>
        <button onclick="updateInput(5)">5</button>
        <button onclick="updateInput(6)">6</button>
        <button onclick="updateInput(7)">7</button>
        <button onclick="updateInput(8)">8</button>
        <button onclick="updateInput(9)">9</button>
        <button onclick="toggleNegative()">-</button>
        <button onclick="updateInput(0)">0</button>
        <button class="special" onclick="clearInput()">Reset</button>
      </div>
      <div class="modal-controls">
        <button class="confirm" onclick="confirmMove()">OK</button>
        <button class="cancel" onclick="closeModal()">Anuluj</button>
      </div>
    </div>
  </div>
  
  <script>
    let scores = JSON.parse(localStorage.getItem('scrabbleScores')) || { 1: [], 2: [] };
    let players = JSON.parse(localStorage.getItem('scrabblePlayers')) || { 1: "Gracz 1", 2: "Gracz 2" };
    let currentPlayer = null;
    
    function updateUI() {
      document.getElementById('player1-name').innerText = players[1];
      document.getElementById('player2-name').innerText = players[2];
      
      [1, 2].forEach(player => {
        const scoreEl = document.getElementById(`player${player}-scores`);
        const totalEl = document.getElementById(`player${player}-total`);
        let total = 0;
        scoreEl.innerHTML = "";
        totalEl.innerHTML = "";
        
        scores[player].forEach(score => {
          total += isNaN(score) ? 0 : score;
          scoreEl.innerHTML += `<div>${score}</div>`;
          totalEl.innerHTML += `<div>${total}</div>`;
        });
      });

      const swapButton = document.getElementById('swap-players');
      const clearState = scores[1].length === 0 && scores[2].length === 0;
      swapButton.disabled = !clearState;
      swapButton.title = clearState
        ? "Zamień graczy miejscami"
        : "Zamiana dostępna tylko przy pustej grze";
    }
    
    function swapPlayers() {
      if (scores[1].length > 0 || scores[2].length > 0) return;
      [players[1], players[2]] = [players[2], players[1]];
      [scores[1], scores[2]] = [scores[2], scores[1]];
      localStorage.setItem('scrabblePlayers', JSON.stringify(players));
      localStorage.setItem('scrabbleScores', JSON.stringify(scores));
      updateUI();
    }

    function setPlayerName(player) {
      const name = prompt("Podaj nazwę gracza:", players[player]);
      if (name) {
        players[player] = name;
        localStorage.setItem('scrabblePlayers', JSON.stringify(players));
        updateUI();
      }
    }
    
    function showModal(player) {
      currentPlayer = player;
      currentInput = "";
      document.getElementById("modal-display").innerText = "0";
      document.getElementById("modal").style.display = "flex";
    }

    function updateInput(value) {
      currentInput += value;
      document.getElementById("modal-display").innerText = currentInput;
    }

    function toggleNegative() {
      currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : "-" + currentInput;
      document.getElementById("modal-display").innerText = currentInput;
    }

    function clearInput() {
      currentInput = "";
      document.getElementById("modal-display").innerText = "0";
    }

    function confirmMove() {
      scores[currentPlayer].push(parseInt(currentInput) || 0);
      localStorage.setItem('scrabbleScores', JSON.stringify(scores));
      closeModal();
      updateUI();
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
    
    function addSpecialMove(player, move) {
      scores[player].push(move);
      localStorage.setItem('scrabbleScores', JSON.stringify(scores));
      updateUI();
    }
    
    function undoMove(player) {
      if (scores[player].length > 0 && confirm("Czy na pewno chcesz cofnąć ostatni ruch?")) {
        scores[player].pop();
        localStorage.setItem('scrabbleScores', JSON.stringify(scores));
        updateUI();
      }
    }
    
    function resetGame() {
      if (confirm("Czy na pewno chcesz zresetować grę?")) {
        scores = { 1: [], 2: [] };
        localStorage.setItem('scrabbleScores', JSON.stringify(scores));
        updateUI();
      }
    }
    
    updateUI();
  </script>
</body>
</html>
